# Render Blueprint: one Docker web service on Render's free plan. Free instances have no
# persistent disk, so the database, uploads and exports reset whenever the service restarts or
# sleeps (after about 15 minutes without visits). To keep data, switch to plan: starter and add:
#   disk: { name: storeforge-data, mountPath: /app/data, sizeGB: 1 }
# Deploy with the "Deploy to Render" button in README.md.
services:
  - type: web
    name: storeforge
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_PASSWORD
        sync: false # you're asked for it on first deploy; the browser prompts for it
      - key: SESSION_SECRET
        generateValue: true
      - key: AI_MODE
        value: fixture # offline demo; set to "live" once ANTHROPIC_API_KEY is filled in
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
